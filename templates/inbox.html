{% extends 'base.html' %}{% block content %}<h1>Review notices.</h1><p class="intro">In-app notices only. No real email has been sent.</p><div class="notice-list">{% for notice in notices %}<section class="card"><span class="badge {{ notice.status }}">{{ notice.status|replace('_',' ') }}</span><p>{{ notice.message }}</p><div class="notice-bottom"><a href="/requests/{{ notice.request_id }}">View findings →</a></div></section>{% else %}<section class="card empty-state"><h2>No notices yet.</h2><a href="/">Start a review →</a></section>{% endfor %}</div>{% endblock %}
